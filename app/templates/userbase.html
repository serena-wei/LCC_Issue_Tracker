<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - LCC Issue Tracker</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="app-body">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <nav class="navbar navbar-expand-md navbar-dark app-navbar mb-0">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand" href="/">LCC Issue Tracker</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item">
            <a class="nav-link{{ ' active' if request.args.get('status') == 'unresolved' else '' }}" href="{{ url_for('issues.issues', status='unresolved') }}">Unresolved</a>
          </li>
          <li class="nav-item">
            <a class="nav-link{{ ' active' if request.args.get('status') == 'resolved' else '' }}" href="{{ url_for('issues.issues', status='resolved') }}">Resolved</a>
          </li>
          {% if session.get('role') == 'admin' %}
          <li class="nav-item">
            <a class="nav-link{{ ' active' if active_page == 'userlist' else '' }}" href="{{ url_for('users.user_list') }}">Users</a>
          </li>
          {% endif %}
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link{{ ' active' if active_page == 'profile' else '' }}" href="{{ url_for('users.profile') }}">Profile</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('auth.logout') }}">Log out</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
