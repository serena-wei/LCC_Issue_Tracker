<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{% block title %}{% endblock %} - LCC Issue Tracker</title>
		<!-- favicon adds a small icon in the tab bar of browser -->
		<link rel="icon" type="image/x-icon" href="/static/favicon.png">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
		<style>
			/* Ensures tables are scrollable on small screens */
			.table-responsive {
				overflow-x: auto;
			}
	
			/* Makes images responsive, scaling them to the size of their container */
			.img-fluid {
				max-width: 100%;
				height: auto;
			}
		</style>
	</head>	
	<body>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

		<nav class="navbar navbar-expand-sm navbar-dark bg-success mb-3">
			<div class="container-fluid">
				<a class="navbar-brand" href="/">LCC Issue Tracker</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav me-auto">
						<li class="nav-item">
							<a class="nav-link{{ ' active' if request.args.get('status') == 'unresolved' else '' }} text-decoration-none" href="{{ url_for('issues', status='unresolved') }}">Unresolved Issues</a>
						</li>
						<li class="nav-item">
							<a class="nav-link{{ ' active' if request.args.get('status') == 'resolved' else '' }} text-decoration-none" href="{{ url_for('issues', status='resolved') }}">Resolved Issues</a>
						</li>
						<li class="nav-item">
							<a class="nav-link{{' active' if active_page=='userlist' else ''}}" href="{{ url_for('user_list') }}">User List</a>
						</li>
					</ul>
					<ul class="navbar-nav">
						<li class="nav-item">
							<a class="nav-link{{' active' if active_page=='profile' else ''}}" href="{{ url_for('profile') }}">User Profile</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="{{ url_for('logout') }}">Log Out</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>

		<main>
			{% block content %}{% endblock %}
		</main>
	</body>
</html>
